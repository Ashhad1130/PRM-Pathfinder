# Condition C — the random-reference control.
#
# Identical to retrieval.yaml except `retrieval.reference_mode: random`. References are
# drawn uniformly from the pool instead of ranked by similarity: same number of them, same
# rendering, same contamination guard, so the prompt is the same length and only the
# *relevance* is gone.
#
# This is the control that decides what Condition B's gain means:
#
#   B > C  ->  the gain comes from retrieving SIMILAR examples. The hypothesis survives.
#   B ~ C  ->  the gain comes from having MORE TEXT in the prompt. The mechanism is not
#              what the pitch claims, and the honest headline is a null result.
#   C > A  ->  extra context helps on its own; report it, it is a finding about the model.
#
# Run it on the same subsets and the same limit as A and B, or the three arms are not
# comparable. Check `retrieval.mean_step_similarity` in summary.json afterwards: it must be
# far below Condition B's, otherwise the "random" draw was not random enough to be a control.

run:
  name: control-random
  out_dir: runs
  save_traces: true
  log_every: 25

data:
  processbench_id: Qwen/ProcessBench
  subsets: [gsm8k, math, olympiadbench, omnimath]
  limit_per_subset: null
  pool_id: declare-lab/PathFinder-600K
  pool_split: train
  pool_max_items: 50000
  pool_dir: data/pool

retrieval:
  enabled: true
  encoder_name: sentence-transformers/all-MiniLM-L6-v2
  encoder_batch_size: 128
  pca_components: 128
  pca_whiten: false

  top_k_questions: 8            # stage 1 — dataset shift
  top_k_steps: 2                # stage 2 — reasoning-style shift; 1-2 per the pitch
  step_level: true              # set false to ablate stage 2

  # The one line that separates this config from retrieval.yaml.
  reference_mode: random
  random_seed: 17               # the draw is also mixed with the query, so resuming is safe

  # Contamination guard. ProcessBench and PathFinder-600K share upstream sources, so a
  # near-identical pool question would hand the grader the answer key.
  max_question_similarity: 0.95
  drop_exact_duplicates: true

  index_dir: artifacts/index

prm:
  backend: hf
  model_name: declare-lab/PathFinder-PRM-7B
  dtype: bfloat16
  device_map: auto
  attn_implementation: auto
  correctness_threshold: 0.5
  early_stop: true
  max_input_tokens: 8192
  seed: 17

prompt:
  include_reference_labels: true
  max_reference_chars: 600
